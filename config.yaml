# Cutoff date for league filtering (ISO 8601 date string).
# Only leagues with matches on or after this date are included.
# cutoff_date: "2026-05-06" # 7.41c
# cutoff_date: "2025-05-21" # 7.39
cutoff_date: "2024-07-31" # 7.37

# Tournament tiers to include
tiers:
  - 1
  - 2

# API configuration
stratz:
  api_key: "${STRATZ_API_KEY}"
  base_url: "https://api.stratz.com/v1"
  max_retries: 5
  retry_delay: 10.0

opendota:
  base_url: "https://api.opendota.com/api"
  max_retries: 5
  retry_delay: 10.0

# Concurrency settings
concurrency:
  max_workers: 5
  max_connections_per_host: 1
  rate_limit_per_second: 1

# Output settings
output:
  directory: "./data"
  chunk_size: 1000  # number of matches per .pt file

# State database
state:
  database_path: "./state.db"

# Graph construction settings
graph:
  wilson_threshold: 0.42 # Optuna best found
  gamma: 0.72 # Optuna best found

# Model architecture defaults
model:
  d_model: 128
  nhead: 4
  dim_feedforward: 2048 # Optuna best found
  num_layers_rgcn: 3
  num_layers_transformer: 13
  dropout: 0.1

# Training configuration defaults
training:
  learning_rate: 0.0001
  step_loss_gamma: 0.0
  label_smoothing_eps: 0.15
  augment: 25 # Optuna best found
  batch_size: 16
  skip_gram_lr: 0.01
  dgi_lr: 0.01
  rgcn_lr: 0.0015
