# Cutoff date for league filtering (ISO 8601 date string).
# Only leagues with matches on or after this date are included.
# cutoff_date: "2026-05-06" # 7.41c
# cutoff_date: "2025-05-21" # 7.39
cutoff_date: "2024-07-31" # 7.37

# Tournament tiers to include
tiers:
  - 1
  - 2

# API configuration
stratz:
  api_key: "${STRATZ_API_KEY}"
  base_url: "https://api.stratz.com/v1"
  max_retries: 5
  retry_delay: 10.0

opendota:
  base_url: "https://api.opendota.com/api"
  max_retries: 5
  retry_delay: 10.0

# Concurrency settings
concurrency:
  max_workers: 5
  max_connections_per_host: 1
  rate_limit_per_second: 1

# Output settings
output:
  directory: "./data"
  chunk_size: 1000  # number of matches per .pt file

# State database
state:
  database_path: "./state.db"

# Graph construction settings
graph:
  wilson_threshold: 0.53 # Optuna best found (Trial 10)
  gamma: 0.70 # Optuna best found (Trial 10)

# Model architecture defaults
model:
  d_model: 128 # Optuna best found
  nhead: 16 # Optuna best found (Trial 10)
  dim_feedforward: 512 # Optuna best found (Trial 10 - prevents overfitting)
  num_layers_rgcn: 3
  num_layers_transformer: 19 # Optuna best found (Trial 10)
  dropout: 0.21 # Optuna best found (Trial 10)

# Training configuration defaults
training:
  learning_rate: 1.5e-04 # Optuna best found (Trial 10)
  step_loss_gamma: 0.23
  augment: 30 # Optuna best found (Trial 10)
  batch_size: 256 # Optuna best found (Trial 10)
  skip_gram_lr: 0.186 # Optuna best found (Trial 10)
  dgi_lr: 0.0164 # Optuna best found (Trial 10)
  rgcn_lr: 1.46e-05 # Optuna best found (Trial 10)
  checkpoint_metric: "val_brier"
  aw_tau_start: 0.12 # Optuna best found (Trial 10)
  aw_tau_end: 0.045 # Optuna best found (Trial 10)
  aw_tau_decay_epochs: 50
  aw_clip_min: 0.1
  aw_clip_max: 10.0
  stage: 1
  draft_sample_weight: 9.87 # Optuna best found (Trial 10)
  pub_data_dir: "./data"
  pub_patience: 5
  seed: 42
