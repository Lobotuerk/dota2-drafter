# Target patch to filter matches (e.g., "7.35", "7.34")
patch = "7.35"

# Tournament tiers to include
tiers:
  - 1
  - 2

# API configuration
stratz:
  api_key: "${STRATZ_API_KEY}"
  base_url: "https://api.stratz.com/v1"
  max_retries: 5
  retry_delay: 2.0

opendota:
  base_url: "https://api.opendota.com/api"
  max_retries: 5
  retry_delay: 2.0

# Concurrency settings
concurrency:
  max_workers: 10
  max_connections_per_host: 5
  rate_limit_per_second: 5

# Output settings
output:
  directory: "./data"
  chunk_size: 1000  # number of matches per .pt file

# State database
state:
  database_path: "./state.db"
