[project]
name = "dota2-drafter"
version = "0.1.0"
description = "Dota 2 draft ingestion pipeline for PyTorch dataset generation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "aiohttp-graphql-client>=0.4.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
]

[project.scripts]
dota2-drafter = "dota2drafter.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
